<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <svg viewBox="0 0 600 600">
        <circle cx="300" cy="300" r="100" fill="none" stroke="#222" stroke-width="1" />
        <circle cx="300" cy="300" r="170" fill="none" stroke="#222" stroke-width="1" />
        <circle cx="300" cy="300" r="240" fill="none" stroke="#222" stroke-width="1" />

        <circle cx="300" cy="300" r="12" fill="#fff" />

        <g id="orbit-seconds" class="planet" style="transform-origin: 300px 300px;">
            <circle cx="300" cy="200" r="4" fill="#aaa" />
        </g>

        <g id="orbit-minutes" class="planet" style="transform-origin: 300px 300px;">
            <circle cx="300" cy="130" r="6" fill="#ccc" />
        </g>

        <g id="orbit-hours" class="planet" style="transform-origin: 300px 300px;">
            <circle cx="300" cy="60" r="8" fill="#fff" />
        </g>
    </svg>

    <script>
        const secondsGroup = document.getElementById('orbit-seconds');
        const minutesGroup = document.getElementById('orbit-minutes');
        const hoursGroup = document.getElementById('orbit-hours');

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const ms = now.getMilliseconds();

            const accurateSeconds = seconds + (ms / 1000);
            const accurateMinutes = minutes + (accurateSeconds / 60);
            const accurateHours = hours + (accurateMinutes / 60);

            const secondDeg = (accurateSeconds / 60) * 360;
            const minuteDeg = (accurateMinutes / 60) * 360;
            const hourDeg = (accurateHours / 24) * 360; // 24-hour distribution

            secondsGroup.style.transform = `rotate(${secondDeg}deg)`;
            minutesGroup.style.transform = `rotate(${minuteDeg}deg)`;
            hoursGroup.style.transform = `rotate(${hourDeg}deg)`;

            requestAnimationFrame(updateClock);
        }

        // Start loop
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
